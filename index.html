<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Diwali Wishes</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      margin: 15px 0 5px;
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
      text-align: center;
    }
    p.subtitle {
      color: #e0e0e0;
      font-size: 0.95rem;
      margin-bottom: 20px;
      text-align: center;
    }
    .input-box {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 450px;
      margin-bottom: 25px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #ffd700;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    input[type="text"]::placeholder {
      color: #bbb;
    }
    button {
      padding: 12px 20px;
      background: linear-gradient(45deg, #ff4e50, #f9d423);
      border: none;
      border-radius: 8px;
      color: #111;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: scale(1.03);
    }
    .canvas-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 2px solid #ffd700;
    }
    .actions {
      margin-top: 20px;
      display: flex;
      gap: 15px;
    }
    .download-btn {
      background: linear-gradient(45deg, #11998e, #38ef7d);
      color: #fff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      display: inline-block;
    }
  </style>
</head>
<body>

  <h1>🪔 Happy Diwali  🪔</h1>
  <p class="subtitle">Enter your name to generate a personalized Diwali greeting card</p>

  <div class="input-box">
    <input type="text" id="nameInput" placeholder="Enter Your Name Here..." value="Your Name">
    <button onclick="generateCard()">Generate</button>
  </div>

  <div class="canvas-container">
    <canvas id="diwaliCanvas" width="600" height="750"></canvas>
    <div class="actions">
      <a id="downloadLink" download="diwali_wish.png" class="download-btn" onclick="downloadImage()">Download Card 📥</a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('diwaliCanvas');
    const ctx = canvas.getContext('2d');

    function generateCard() {
      const name = document.getElementById('nameInput').value.trim() || 'Your Name';

      // Background Gradient
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#2b0000');
      grad.addColorStop(0.5, '#800000');
      grad.addColorStop(1, '#1a0000');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Gold Border
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 10;
      ctx.strokeRect(15, 15, canvas.width - 30, canvas.height - 30);

      // Inner Decorative Frame
      ctx.strokeStyle = '#ffae00';
      ctx.lineWidth = 2;
      ctx.strokeRect(25, 25, canvas.width - 50, canvas.height - 50);

      // Top Decorative Text
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 24px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText('✨ HAPPY Diwali ✨', canvas.width / 2, 80);

      // Main Heading
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 44px Segoe UI';
      ctx.fillText('Festival of Lights', canvas.width / 2, 140);

      // Diya Icon Artwork
      drawDiya(canvas.width / 2, 230);

      // Wish Message Text in English
      ctx.fillStyle = '#fff8dc';
      ctx.font = '20px Segoe UI';
      
      const wishes = [
        "May the festival of lights illuminate your life",
        "with joy, peace, prosperity, and success.",
        "Wishing you and your family",
        "a very Happy & Blessed Diwali!"
      ];

      let startY = 370;
      wishes.forEach((line) => {
        ctx.fillText(line, canvas.width / 2, startY);
        startY += 35;
      });

      // Divider Line
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(100, startY + 10);
      ctx.lineTo(canvas.width - 100, startY + 10);
      ctx.stroke();

      // Greeting Sender Name
      ctx.fillStyle = '#ffae00';
      ctx.font = 'italic 22px Segoe UI';
      ctx.fillText('Warmest Wishes From:', canvas.width / 2, startY + 60);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 36px Segoe UI';
      ctx.fillText(name, canvas.width / 2, startY + 110);
    }

    function drawDiya(x, y) {
      // Flame Glow
      const flameGlow = ctx.createRadialGradient(x, y - 40, 5, x, y - 40, 45);
      flameGlow.addColorStop(0, 'rgba(255, 255, 0, 1)');
      flameGlow.addColorStop(0.4, 'rgba(255, 140, 0, 0.8)');
      flameGlow.addColorStop(1, 'rgba(255, 69, 0, 0)');
      ctx.fillStyle = flameGlow;
      ctx.beginPath();
      ctx.arc(x, y - 40, 45, 0, Math.PI * 2);
      ctx.fill();

      // Inner Flame
      ctx.fillStyle = '#ffcc00';
      ctx.beginPath();
      ctx.moveTo(x, y - 75);
      ctx.quadraticCurveTo(x + 18, y - 35, x, y - 15);
      ctx.quadraticCurveTo(x - 18, y - 35, x, y - 75);
      ctx.fill();

      // Diya Base
      ctx.fillStyle = '#d4af37';
      ctx.beginPath();
      ctx.arc(x, y - 10, 65, 0, Math.PI);
      ctx.fill();

      // Base Rim
      ctx.fillStyle = '#ffae00';
      ctx.fillRect(x - 70, y - 15, 140, 10);
    }

    function downloadImage() {
      const link = document.getElementById('downloadLink');
      link.href = canvas.toDataURL('image/png');
    }

    window.onload = generateCard;
  </script>
</body>
</html>
